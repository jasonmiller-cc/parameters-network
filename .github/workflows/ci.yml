name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # parameters-core is a sibling repo; check it out at the same level.
          path: parameters-network

      - uses: actions/checkout@v4
        with:
          repository: jasonmiller-cc/parameters-core
          path: parameters-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: parameters-network/go.sum

      - name: Tidy
        working-directory: parameters-network
        run: go mod tidy && git diff --exit-code go.sum

      - name: Vet
        working-directory: parameters-network
        run: go vet ./...

      - name: Build (linux/amd64)
        working-directory: parameters-network
        run: GOOS=linux GOARCH=amd64 go build ./...

      - name: Test
        working-directory: parameters-network
        run: go test ./... -race -count=1 -timeout 60s

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          path: parameters-network

      - uses: actions/checkout@v4
        with:
          repository: jasonmiller-cc/parameters-core
          path: parameters-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/jasonmiller-cc/parameters-network:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
